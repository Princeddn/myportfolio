<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maison connectée IoT">
  <g fill="var(--primary-svg-color, #1d1d1f)" stroke="var(--primary-svg-color, #1d1d1f)">
    <!-- Maison : corps + toit -->
    <path d="M150 150 L200 110 L250 150 L250 220 L150 220 Z" stroke="none" fill-opacity="0.16"/>
    <path d="M150 150 L200 110 L250 150 L250 220 L150 220 Z" fill="none" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Porte -->
    <path d="M188 220 L188 185 L212 185 L212 220" fill="none" stroke-width="2.5" stroke-opacity="0.7"/>
    <!-- Hub central connecté -->
    <circle cx="200" cy="165" r="9" stroke="none" fill-opacity="0.95"/>

    <!-- Ondes de signal émanant du toit -->
    <g fill="none" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65">
      <path d="M214 96 A20 20 0 0 1 214 124"/>
      <path d="M226 86 A34 34 0 0 1 226 134"/>
    </g>

    <!-- Noeuds/capteurs autour, reliés au hub -->
    <g stroke-width="2" stroke-dasharray="3 5" stroke-opacity="0.55" fill="none">
      <line x1="200" y1="165" x2="92" y2="96"/>
      <line x1="200" y1="165" x2="316" y2="118"/>
      <line x1="200" y1="165" x2="104" y2="238"/>
      <line x1="200" y1="165" x2="308" y2="234"/>
    </g>
    <g stroke="none">
      <circle cx="92" cy="96" r="13" fill-opacity="0.22"/>
      <circle cx="92" cy="96" r="6"/>
      <circle cx="316" cy="118" r="13" fill-opacity="0.22"/>
      <circle cx="316" cy="118" r="6"/>
      <circle cx="104" cy="238" r="13" fill-opacity="0.22"/>
      <circle cx="104" cy="238" r="6"/>
      <circle cx="308" cy="234" r="13" fill-opacity="0.22"/>
      <circle cx="308" cy="234" r="6"/>
    </g>
  </g>
</svg>
